<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tecnologia da Informação — Nilton Bakargi</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #ffffff;
      --card:    #efefef;
      --accent:  #2c5f2e;
      --text:    #1a1a1a;
      --muted:   #777777;
      --ease:    0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .back {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color var(--ease);
    }

    .back:hover { color: var(--accent); }

    h1 {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 40px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 40px;
      border-radius: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 640px;
    }

    .app-link {
      display: block;
      padding: 18px 20px;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      transition: background var(--ease), color var(--ease);
    }

    .app-link:hover {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

  <a class="back" href="../index.html">&larr; Voltar</a>

  <h1>Tecnologia da Informa&ccedil;&atilde;o</h1>
  <p class="subtitle">Aplica&ccedil;&otilde;es em Desenvolvimento</p>
  <div class="divider"></div>

  <div class="grid">
    <a class="app-link" href="../penomato/index.html">Penomato</a>
    <a class="app-link" href="../siteminha-embrapa/index.html">Meu Sisteminha</a>
    <a class="app-link" href="../gastrozen/index.html">GastoZen</a>
    <a class="app-link" href="../coisa-boa/index.html">Coisa Boa</a>
    <a class="app-link" href="../topocad/index.html">TopoCad</a>
    <a class="app-link" href="../imagens/ti.html">Imagens</a>
  </div>

</body>
</html>
