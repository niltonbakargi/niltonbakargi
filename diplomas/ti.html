  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;

      letter-spacing: 3px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 48px;
      text-align: center;
    }

    .em-breve {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 48px 24px;
      border: 1px dashed #e0e0e0;
      border-radius: 4px;
      color: #ccc;
    }

    .em-breve svg {
      width: 40px;
      height: 40px;
      fill: #e0e0e0;
      margin-bottom: 16px;
    }

    .em-breve p {
