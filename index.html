<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nilton Dobes Bakargi</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #ffffff;
      --surface: #f7f7f7;
      --card:    #efefef;
      --border:  #d8d8d8;
      --accent:  #2c5f2e;
      --text:    #1a1a1a;
      --muted:   #777777;
      --ease:    0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 56px;
    }

    .tel {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #aaa;
      text-decoration: none;
      margin-bottom: 16px;
      transition: color 0.2s;
    }

    .tel:hover { color: #25d366; }

    .tel svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .nome {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }

    .cargo {
      margin-top: 10px;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 20px auto 0;
      border-radius: 2px;
    }

    /* ── AREAS ── */
    .areas {
      display: flex;
      flex-direction: row;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
      align-items: flex-start;
      justify-content: center;
    }

    .area-card {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden;
      transition: none;
      min-width: 0;
    }

    .area-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .area-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
    }

    .area-chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform var(--ease), color var(--ease);
    }

    .area-card.open .area-chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }

    /* ── SUBITENS ── */
    .area-sub {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .area-card.open .area-sub {
      max-height: 500px;
    }

    .sub-inner {
      padding: 8px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
    }

    .sub-link {
      display: block;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-align: center;
      transition: background var(--ease), color var(--ease);
    }

    .sub-link:hover {
      background: var(--card);
      color: var(--accent);
    }

    /* ── WHATSAPP ── */
    .whatsapp {
      margin-top: 48px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-decoration: none;
      transition: color var(--ease);
    }

    .whatsapp:hover { color: var(--accent); }

    .whatsapp svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .areas {
        flex-direction: column;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

    <a href="https://wa.me/5567981415533" target="_blank" class="tel">

    <h1 class="nome">Nilton Dobes Bakargi</h1>

      <div class="area-sub">
        <div class="sub-inner">

          <a class="sub-link" href="ed-fisica/index.html">Educa&ccedil;&atilde;o F&iacute;sica &mdash; UFMS</a>
          <a class="sub-link" href="imagens/educacao.html">Imagens</a>

    </div>

    <!-- ENG. FLORESTAL -->
    <div class="area-card" id="card-florestal">
      <div class="area-header" onclick="toggle('card-florestal')">

      <div class="area-sub">
        <div class="sub-inner">

    <!-- TECNOLOGIA DA INFORMACAO -->
    <div class="area-card" id="card-ti">
      <div class="area-header" onclick="toggle('card-ti')">
        <span class="area-name" style="white-space: nowrap;">Tecnologia da Informa&ccedil;&atilde;o</span>
      </div>
      <div class="area-sub">
        <div class="sub-inner">
          <a class="sub-link" href="ti/index.html" target="_blank">Aplica&ccedil;&otilde;es em Desenvolvimento</a>
          <a class="sub-link" href="diplomas/ti.html">Diplomas</a>
        </div>
      </div>
    </div>

  </nav>


  <script>
    function toggle(id) {
      const card = document.getElementById(id);
      const isOpen = card.classList.contains('open');

      // fecha todos
      document.querySelectorAll('.area-card').forEach(c => c.classList.remove('open'));

      // abre o clicado se estava fechado
      if (!isOpen) card.classList.add('open');
    }

    // hover no desktop
    document.querySelectorAll('.area-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        document.querySelectorAll('.area-card').forEach(c => c.classList.remove('open'));
        card.classList.add('open');
      });
      card.addEventListener('mouseleave', () => {
        card.classList.remove('open');
      });
    });
  </script>
