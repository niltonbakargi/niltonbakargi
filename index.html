<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nilton Dobes Bakargi</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ativa: #16a34a;
      --text:   #1e293b;
      --muted:  #64748b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f8fafc;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px 80px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 56px;
    }

    .nome {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--ativa);
      margin: 18px auto 0;
      border-radius: 2px;
      transition: background 0.5s ease, width 0.5s ease;
    }

    /* CAROUSEL */
    .carousel-section {
      width: 100%;
      max-width: 900px;
      margin-bottom: 48px;
      position: relative;
    }

    .carousel-wrapper {
      position: relative;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 2.6rem;
      color: var(--muted);
      cursor: pointer;
      z-index: 20;
      padding: 0 8px;
      line-height: 1;
      opacity: 0.30;
      transition: opacity 0.2s;
      font-weight: 300;
    }
    .carousel-nav:hover { opacity: 0.75; }
    .carousel-nav.prev { left: 0; }
    .carousel-nav.next { right: 0; }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 80px;
    }

    .cat-item {
      position: absolute;
      top: 50%;
      left: 50%;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.52s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity  0.52s ease,
                  color    0.35s ease,
                  font-size 0.52s ease;
      user-select: none;
    }

    /* SERVICOS */
    .area-servicos {
      width: 100%;
      max-width: 560px;
      margin-bottom: 48px;
      min-height: 0;
      transition: opacity 0.25s ease;
    }

    .item { border-bottom: 1px solid var(--border); }
    .item:first-child { border-top: 1px solid var(--border); }

    .item-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      user-select: none;
      transition: color 0.2s;
      gap: 12px;
    }

    .item-seta {
      font-size: 0.825rem;
      color: #ccc;
      flex-shrink: 0;
      transition: transform 0.25s ease, color 0.2s;
    }

    .item-texto {
      display: none;
      padding: 0 0 14px;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.8;
    }
    .item.aberto .item-texto { display: block; }

    /* TRABALHOS */
    .trabalhos-section {
      margin-top: 24px;
      width: 100%;
      max-width: 860px;
    }

    .trabalhos-titulo {
      text-align: center;
      font-size: 1.17rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 32px;
    }

    .trabalhos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 400px));
      justify-content: center;
      gap: 24px;
      transition: opacity 0.25s ease;
    }

    .trabalhos-vazio {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      padding: 48px 0;
      letter-spacing: 1px;
      grid-column: 1 / -1;
    }

    .trabalho-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      animation: entrar 0.35s ease forwards;
    }

    @keyframes entrar {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .trabalho-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .trabalho-sem-img {
      width: 100%;
      height: 260px;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .trabalho-corpo { padding: 16px 18px 20px; }

    .trabalho-data {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .trabalho-nome {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .trabalho-desc {
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
    }

    .trabalho-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .trabalho-meta span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.ativo { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      cursor: default;
    }
    .lightbox-fechar {
      position: absolute;
      top: 18px; right: 26px;
      color: white;
      font-size: 2.2rem;
      cursor: pointer;
      opacity: 0.7;
      line-height: 1;
      user-select: none;
    }
    .lightbox-fechar:hover { opacity: 1; }

    /* WHATSAPP */
    .whatsapp {
      margin-top: 64px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 1.275rem;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .whatsapp:hover { color: #22c55e; }
    .whatsapp svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    @media (max-width: 620px) {
      .carousel-wrapper { height: 64px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="nome">Nilton Dobes Bakargi</h1>
    <div class="divider" id="divider"></div>
  </header>

  <div class="carousel-section">
    <div class="carousel-wrapper" id="carousel-wrapper">
      <button class="carousel-nav prev" onclick="rodar(-1)">&#8249;</button>
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-nav next" onclick="rodar(1)">&#8250;</button>
    </div>
  </div>

  <div class="area-servicos" id="area-servicos"></div>

  <section class="trabalhos-section" id="trabalhos">
    <h2 class="trabalhos-titulo">Últimos Trabalhos</h2>
    <div class="trabalhos-grid" id="trabalhos-grid">
      <p class="trabalhos-vazio">Nenhum trabalho nesta área ainda.</p>
    </div>
  </section>

  <a href="https://wa.me/5567981415533" target="_blank" class="whatsapp">
    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    67 98141-5533

  <footer style="margin-top:16px;padding-bottom:8px;">
    <a href="admin/" style="font-size:0.65rem;letter-spacing:2px;color:#94a3b8;text-decoration:none;text-transform:uppercase;font-family:'Montserrat',sans-serif;">Admin</a>
  </footer>

  <div class="lightbox" id="lightbox" onclick="fecharLightbox()">
    <span class="lightbox-fechar" onclick="fecharLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" />
  </div>

  <script>
    var CATEGORIAS = [
      { id: 'mecanica',  label: 'Mec\u00e2nica Geral',          cor: '#d97706' },
      { id: 'educacao',  label: 'Educa\u00e7\u00e3o F\u00edsica', cor: '#7c3aed' },
      { id: 'florestal', label: 'Eng. Florestal',                cor: '#16a34a' },
      { id: 'geo',       label: 'Geotecnologias',                cor: '#0284c7' },
      { id: 'ti',        label: 'Tecnologia da Informa\u00e7\u00e3o', cor: '#475569' }
    ];

    var SERVICOS = {
      florestal: [
        { t: 'Invent\u00e1rio Florestal',
          d: 'Levantamento e identifica\u00e7\u00e3o de esp\u00e9cies arb\u00f3reas urbanas e nativas, com emiss\u00e3o de laudo t\u00e9cnico e ART.' },
        { t: 'Recupera\u00e7\u00e3o de \u00c1reas Degradadas',
          d: 'Planejamento e execu\u00e7\u00e3o de projetos de restaura\u00e7\u00e3o ecol\u00f3gica em \u00e1reas de preserva\u00e7\u00e3o permanente e reserva legal.' },
        { t: 'CAR \u2014 Cadastro Ambiental Rural',
          d: 'Elabora\u00e7\u00e3o, regulariza\u00e7\u00e3o e atualiza\u00e7\u00e3o do Cadastro Ambiental Rural junto ao SICAR, com an\u00e1lise da propriedade e adequa\u00e7\u00e3o \u00e0 legisla\u00e7\u00e3o do C\u00f3digo Florestal.' },
        { t: 'Defesas Ambientais',
          d: 'Assessoria t\u00e9cnica em defesas administrativas e jur\u00eddicas: multas ambientais, TACs, inqu\u00e9ritos civis, laudos ambientais e demais exig\u00eancias de \u00f3rg\u00e3os ambientais.' },
        { t: 'Plantio e Manejo de Mudas Nativas',
          d: 'Sele\u00e7\u00e3o de esp\u00e9cies, plantio e acompanhamento t\u00e9cnico de mudas nativas para recomposi\u00e7\u00e3o de vegeta\u00e7\u00e3o.' },
        { t: 'Remo\u00e7\u00e3o de \u00c1rvores Perigosas',
          d: 'Avalia\u00e7\u00e3o fitossanit\u00e1ria, emiss\u00e3o de laudo e obten\u00e7\u00e3o de autoriza\u00e7\u00e3o para remo\u00e7\u00e3o segura de \u00e1rvores de risco.' }
      ],
      geo: [
        { t: 'Georreferenciamento de Im\u00f3veis Rurais',
          d: 'Medi\u00e7\u00e3o e certifica\u00e7\u00e3o de propriedades rurais junto ao INCRA, conforme exig\u00eancia legal para transfer\u00eancia e financiamento de im\u00f3veis rurais.' },
        { t: 'Levantamento Topogr\u00e1fico e Planialtim\u00e9trico',
          d: 'Levantamento detalhado do terreno com representa\u00e7\u00e3o de curvas de n\u00edvel, declividades e elementos f\u00edsicos, para projetos de engenharia e arquitetura.' },
        { t: 'Loca\u00e7\u00e3o de Terrenos',
          d: 'Implanta\u00e7\u00e3o de obras no terreno com base em projeto aprovado, garantindo a correta posi\u00e7\u00e3o das constru\u00e7\u00f5es conforme limites da propriedade.' },
        { t: 'Desmembramento e Remembramento',
          d: 'Divis\u00e3o ou unifica\u00e7\u00e3o de \u00e1reas urbanas e rurais com elabora\u00e7\u00e3o de memorial descritivo, planta t\u00e9cnica e registro em cart\u00f3rio.' }
      ],
      mecanica: [],
      educacao: [],
      ti: []
    };

    /* Posições no carrossel: índice 0=mais esq, 4=mais dir, 2=centro */
    var OFFSETS = [
      { x: -340, scale: 0.46, opacity: 0.15, fs: '0.60rem' },
      { x: -175, scale: 0.70, opacity: 0.48, fs: '0.80rem' },
      { x:    0, scale: 1.00, opacity: 1.00, fs: '1.10rem' },
      { x:  175, scale: 0.70, opacity: 0.48, fs: '0.80rem' },
      { x:  340, scale: 0.46, opacity: 0.15, fs: '0.60rem' }
    ];

    var ativo = 2; /* começa em Eng. Florestal */
    var todosTrabalhos = [];

    function renderCarrossel() {
      var track = document.getElementById('carousel-track');
      track.innerHTML = '';

      CATEGORIAS.forEach(function(cat, i) {
        var offset = i - ativo;
        var posIdx = offset + 2;
        var el = document.createElement('div');
        el.className = 'cat-item';
        el.textContent = cat.label;
        el.onclick = (function(idx) { return function() { irPara(idx); }; })(i);

        if (posIdx < 0 || posIdx > 4) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          el.style.transform = 'translate(-50%, -50%) translateX(' + (offset > 0 ? 600 : -600) + 'px) scale(0.3)';
        } else {
          var p = OFFSETS[posIdx];
          el.style.opacity    = p.opacity;
          el.style.fontSize   = p.fs;
          el.style.color      = (i === ativo) ? cat.cor : 'var(--muted)';
          el.style.zIndex     = (i === ativo) ? 10 : (5 - Math.abs(offset));
          el.style.transform  = 'translate(-50%, -50%) translateX(' + p.x + 'px) scale(' + p.scale + ')';
          el.style.pointerEvents = (Math.abs(offset) <= 2) ? 'auto' : 'none';
        }

        track.appendChild(el);
      });

      /* atualiza cor do divider */
      document.getElementById('divider').style.background = CATEGORIAS[ativo].cor;
      document.documentElement.style.setProperty('--ativa', CATEGORIAS[ativo].cor);
    }

    function renderServicos() {
      var container = document.getElementById('area-servicos');
      var cat = CATEGORIAS[ativo];
      var lista = SERVICOS[cat.id] || [];

      if (!lista.length) { container.innerHTML = ''; return; }

      var html = '';
      lista.forEach(function(s) {
        html += '<div class="item">' +
          '<div class="item-titulo" onclick="toggleItem(this)">' +
            s.t +
            '<span class="item-seta">&#9660;</span>' +
          '</div>' +
          '<div class="item-texto">' + s.d + '</div>' +
        '</div>';
      });
      container.innerHTML = html;

      /* cor de hover dinâmica */
      container.querySelectorAll('.item-titulo').forEach(function(el) {
        el.addEventListener('mouseenter', function() { this.style.color = cat.cor; });
        el.addEventListener('mouseleave', function() {
          if (!this.parentElement.classList.contains('aberto')) this.style.color = '';
        });
      });
    }

    function filtrarTrabalhos() {
      var cat = CATEGORIAS[ativo];
      var lista = todosTrabalhos.filter(function(t) { return t.categoria === cat.id; });
      renderCards(lista);
    }

    var MESES = ['janeiro','fevereiro','março','abril','maio','junho',
                 'julho','agosto','setembro','outubro','novembro','dezembro'];

    function renderCards(lista) {
      var grid = document.getElementById('trabalhos-grid');
      grid.style.opacity = '0';

      setTimeout(function() {
        grid.innerHTML = '';

        if (!lista || lista.length === 0) {
          grid.innerHTML = '<p class="trabalhos-vazio">Nenhum trabalho nesta \u00e1rea ainda.</p>';
          grid.style.opacity = '1';
          return;
        }

        lista.forEach(function(t) {
          var partes  = t.data ? t.data.split('-') : [];
          var dataStr = '';
          if (partes.length === 3) {
            dataStr = parseInt(partes[2]) + ' de ' + MESES[parseInt(partes[1]) - 1] + ' de ' + partes[0];
          }

          var imgHtml = t.imagem
            ? '<img src="' + t.imagem + '" alt="' + t.titulo + '" loading="lazy" onclick="abrirLightbox(\'' +
              t.imagem + '\',\'' + t.titulo.replace(/'/g, "\\'") + '\')" />'
            : '<div class="trabalho-sem-img">sem imagem</div>';

          var metaHtml = '';
          if (t.local || t.cliente) {
            metaHtml = '<div class="trabalho-meta">';
            if (t.local)   metaHtml += '<span>&#128205; ' + t.local   + '</span>';
            if (t.cliente) metaHtml += '<span>&#128100; ' + t.cliente + '</span>';
            metaHtml += '</div>';
          }

          var card = document.createElement('div');
          card.className = 'trabalho-card';
          card.innerHTML = imgHtml +
            '<div class="trabalho-corpo">' +
              '<div class="trabalho-data">'  + dataStr   + '</div>' +
              '<div class="trabalho-nome">'  + t.titulo  + '</div>' +
              '<div class="trabalho-desc">'  + t.descricao + '</div>' +
              metaHtml +
            '</div>';
          grid.appendChild(card);
        });

        grid.style.opacity = '1';
      }, 200);
    }

    function irPara(idx) {
      if (idx === ativo) return;
      ativo = idx;
      renderCarrossel();
      renderServicos();
      filtrarTrabalhos();
    }

    function rodar(dir) {
      ativo = (ativo + dir + CATEGORIAS.length) % CATEGORIAS.length;
      renderCarrossel();
      renderServicos();
      filtrarTrabalhos();
    }

    function toggleItem(el) {
      var item = el.parentElement;
      item.classList.toggle('aberto');
      var cor = CATEGORIAS[ativo].cor;
      var seta = el.querySelector('.item-seta');
      if (item.classList.contains('aberto')) {
        seta.style.transform = 'rotate(180deg)';
        seta.style.color = cor;
        el.style.color   = cor;
      } else {
        seta.style.transform = '';
        seta.style.color = '';
        el.style.color   = '';
      }
    }

    function abrirLightbox(src, alt) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-img').alt = alt;
      document.getElementById('lightbox').classList.add('ativo');
      document.body.style.overflow = 'hidden';
    }

    function fecharLightbox() {
      document.getElementById('lightbox').classList.remove('ativo');
      document.body.style.overflow = '';
    }

    /* Teclado */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape')      fecharLightbox();
      if (e.key === 'ArrowLeft')   rodar(-1);
      if (e.key === 'ArrowRight')  rodar(1);
    });

    /* Swipe mobile */
    var touchX = 0;
    var wrapper = document.getElementById('carousel-wrapper');
    wrapper.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, { passive: true });
    wrapper.addEventListener('touchend',   function(e) {
      var dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 48) rodar(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* Init */
    renderCarrossel();
    renderServicos();

    fetch('api/trabalhos.php')
      .then(function(r) { return r.json(); })
      .then(function(lista) {
        todosTrabalhos = lista || [];
        filtrarTrabalhos();
      })
      .catch(function() {});
  </script>

</body>
</html>
